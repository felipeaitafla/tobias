# Só existe para a Netlify. Na Vercel, `api/apresentacao.ts` já responde em
# `/api/apresentacao` sozinho — o redirecionamento abaixo é o que faz o mesmo
# caminho valer aqui, para o navegador não precisar saber onde o site está.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/apresentacao"
  to = "/.netlify/functions/apresentacao"
  status = 200

[[redirects]]
  from = "/api/contato"
  to = "/.netlify/functions/contato"
  status = 200

# O endereço que a Netlify dá ao site continua respondendo mesmo com o domínio
# próprio. Sem isto ele serve uma cópia inteira da página — o canonical já
# aponta para o www, mas o Google ainda rastreia as duas. `force` porque os
# arquivos existem nos dois endereços, e sem ele a Netlify serve o arquivo em
# vez de redirecionar.
[[redirects]]
  from = "https://tobiasadv.netlify.app/*"
  to = "https://www.tobias.adv.br/:splat"
  status = 301
  force = true
