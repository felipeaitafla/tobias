# Só existe para a Netlify. Na Vercel, `api/apresentacao.ts` já responde em
# `/api/apresentacao` sozinho — o redirecionamento abaixo é o que faz o mesmo
# caminho valer aqui, para o navegador não precisar saber onde o site está.

[build]
  command = "npm run build"
  publish = "dist"

# Cache. Sem estas regras a Netlify manda `max-age=0` em tudo, e o navegador
# pergunta de novo por cada arquivo a cada visita.
#
# Tudo em `/_astro/` tem o hash do conteúdo no nome: arquivo que muda ganha
# outro endereço, então pode ser guardado para sempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Os vídeos saem de `public/` com nome fixo, então o prazo é curto: um dia sem
# perguntar e, depois disso, serve o guardado enquanto confere. Quem trocar um
# vídeo mantendo o nome pode levar até um dia para ver o novo. Vídeo novo nesta
# pasta precisa da própria regra.
[[headers]]
  for = "/video-hero-720.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/video-hero-1080.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/video-hero-1440.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/video-postos-celular.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/video-postos-desktop.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Endereço inexistente em `/en/` cai na 404 em inglês. A da raiz (`404.html`) a
# Netlify usa sozinha. Sem `force`, a regra só vale onde não há arquivo.
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404

[[redirects]]
  from = "/api/apresentacao"
  to = "/.netlify/functions/apresentacao"
  status = 200

[[redirects]]
  from = "/api/contato"
  to = "/.netlify/functions/contato"
  status = 200

# O endereço que a Netlify dá ao site continua respondendo mesmo com o domínio
# próprio. Sem isto ele serve uma cópia inteira da página — o canonical já
# aponta para o www, mas o Google ainda rastreia as duas. `force` porque os
# arquivos existem nos dois endereços, e sem ele a Netlify serve o arquivo em
# vez de redirecionar.
[[redirects]]
  from = "https://tobiasadv.netlify.app/*"
  to = "https://www.tobias.adv.br/:splat"
  status = 301
  force = true
